<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LogistiqueApp — démo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1f1d;
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; }
  header { height: 120px; padding: 22px 48px 0; display: flex; align-items: center; gap: 22px; }
  .logo { width: 52px; height: 52px; border-radius: 14px; background: #0f766e; display: grid; place-items: center; font-weight: 800; font-size: 28px; }
  .titles h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .2px; }
  .titles p { margin: 2px 0 0; color: #99f6e4; font-size: 15px; }
  .caption { margin-left: auto; max-width: 980px; background: #134e48; border: 1px solid #1f6f66; border-radius: 14px;
    padding: 14px 22px; font-size: 22px; font-weight: 600; transition: opacity .25s; display: flex; gap: 14px; align-items: center; }
  .caption .step { background: #ea580c; border-radius: 999px; padding: 3px 12px; font-size: 15px; font-weight: 800; white-space: nowrap; }
  .stage { display: flex; gap: 40px; padding: 18px 48px 0; align-items: flex-start; }
  .panel { display: flex; flex-direction: column; gap: 10px; }
  .label { font-size: 15px; font-weight: 700; color: #99f6e4; text-transform: uppercase; letter-spacing: 1.2px; display: flex; gap: 8px; align-items: center; }
  .label .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.2); }
  .phone { width: 404px; height: 804px; border-radius: 46px; background: #020617; padding: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 0 0 2px #334155; position: relative; }
  .phone iframe { width: 380px; height: 780px; border: 0; border-radius: 34px; background: #f6f7f9; display: block; }
  .phone.focus, .browser.focus { box-shadow: 0 0 0 4px #ea580c, 0 20px 60px rgba(0,0,0,.5); }
  .browser { width: 944px; height: 804px; border-radius: 16px; background: #fff; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .bar { height: 40px; background: #e2e8f0; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #f87171; display: inline-block; }
  .bar i:nth-child(2) { background: #fbbf24; } .bar i:nth-child(3) { background: #34d399; }
  .bar .url { margin-left: 12px; background: #fff; color: #475569; border-radius: 8px; padding: 4px 14px; font-size: 14px; flex: 1; }
  .browser .viewport { width: 944px; height: 764px; overflow: hidden; }
  .browser iframe { width: 1180px; height: 955px; border: 0; transform: scale(.8); transform-origin: 0 0; }
  .overlay { position: fixed; inset: 0; background: radial-gradient(circle at 30% 30%, #115e59, #0b1f1d 70%); display: flex;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity .6s; z-index: 10; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay .big { width: 110px; height: 110px; border-radius: 30px; background: #0f766e; display: grid; place-items: center; font-size: 60px; font-weight: 800; margin-bottom: 30px; box-shadow: 0 0 0 10px rgba(15,118,110,.25); }
  .overlay h2 { font-size: 64px; margin: 0 0 14px; }
  .overlay p { font-size: 26px; color: #ccfbf1; margin: 6px 0; max-width: 1200px; }
  .overlay .stack { margin-top: 36px; display: flex; gap: 18px; }
  .overlay .stack span { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 10px 22px; font-size: 20px; }
</style>
</head>
<body>
  <header>
    <div class="logo">L</div>
    <div class="titles"><h1>LogistiqueApp</h1><p>Démo du parcours de livraison complet</p></div>
    <div class="caption" id="caption"><span class="step" id="step">Démo</span><span id="text">Préparation…</span></div>
  </header>
  <div class="stage">
    <div class="panel">
      <div class="label"><span class="dot"></span>App mobile · Client</div>
      <div class="phone" id="p-client"><iframe id="client" name="client" allow="geolocation"></iframe></div>
    </div>
    <div class="panel">
      <div class="label"><span class="dot"></span>App mobile · Coursier</div>
      <div class="phone" id="p-courier"><iframe id="courier" name="courier" allow="geolocation"></iframe></div>
    </div>
    <div class="panel">
      <div class="label"><span class="dot"></span>Site web · <span id="weblabel">Espace client</span></div>
      <div class="browser" id="p-web">
        <div class="bar"><i></i><i></i><i></i><span class="url" id="url">logistiqueapp.local</span></div>
        <div class="viewport"><iframe id="web" name="web" allow="geolocation"></iframe></div>
      </div>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <div class="big">L</div>
    <h2 id="ov-title">LogistiqueApp</h2>
    <p id="ov-sub">Livraison urbaine express</p>
    <div class="stack" id="ov-stack"><span>📱 Flutter</span><span>⚙️ Node.js · Socket.IO</span><span>🖥️ React</span></div>
  </div>
<script>
  window.demo = {
    caption(step, text) {
      const c = document.getElementById('caption');
      c.style.opacity = 0;
      setTimeout(() => { document.getElementById('step').textContent = step; document.getElementById('text').textContent = text; c.style.opacity = 1; }, 250);
    },
    focus(id) {
      for (const el of document.querySelectorAll('.phone, .browser')) el.classList.toggle('focus', el.id === 'p-' + id);
    },
    overlay(show, title, sub, stack = true) {
      const o = document.getElementById('overlay');
      if (title) document.getElementById('ov-title').textContent = title;
      if (sub !== undefined) document.getElementById('ov-sub').innerHTML = sub;
      document.getElementById('ov-stack').style.display = stack ? 'flex' : 'none';
      o.classList.toggle('hidden', !show);
    },
    web(label, url) { document.getElementById('weblabel').textContent = label; document.getElementById('url').textContent = url; },
  };
</script>
</body>
</html>
