# Développement local : API Wabap + DynamoDB local (tables créées au démarrage).
#   docker compose up            → http://localhost:4000/graphql
#   docker compose --profile demo up demo   → serveur de démonstration (données fictives) sur :4001
services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]

  tables:
    build: ./backend
    command: ["node", "scripts/tables.js", "create"]
    environment: &local
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE_SUFFIX: -local
    depends_on: [dynamodb]

  api:
    build: ./backend
    ports: ["4000:4000"]
    environment:
      <<: *local
      NODE_ENV: development
      PUBLIC_URL: http://localhost:4000
      # Jetons Cognito réels : renseigner le pool ; sinon AUTH_MODE=dev (jetons non signés, développement seulement)
      AUTH_MODE: dev
      FILES_DIR: /tmp/files
    depends_on:
      tables:
        condition: service_completed_successfully

  demo:
    profiles: ["demo"]
    build: ./backend
    ports: ["4001:4000"]
    environment:
      NODE_ENV: development
      STORE: memory
      AUTH_MODE: dev
      DEMO_SEED: "true"
      SCHEDULER_ENABLED: "false"
      FILES_DIR: /tmp/files
