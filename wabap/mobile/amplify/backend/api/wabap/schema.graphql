type Subscriber @model
  @auth(rules: [
    { allow: groups, groups: ["wabap"] },
    { allow: owner, identityClaim: "custom:clientName" }
  ])
{
  id: ID!
  owner: String! @default(value: "France-Antilles")
  name: String!
  address: String
  numabo: String
  secteur: String
  phone1: String
  phone2: String
  instructions: String
  longitude: Float
  latitude: Float
  mission: Mission @belongsTo
  colis: [Colis] @hasMany
  type: String! @index(name: "subscriberOrderName", queryField: "subscriberOrderName", sortKeyFields: ["name"])
  nb: Int!
  unsubscribed: Boolean
}

type Mission @model
  @auth(rules: [
    { allow: groups, groups: ["wabap"] },
    { allow: owner, identityClaim: "custom:clientName" }
  ])
{
  id: ID!
  owner: String! @default(value: "France-Antilles")
  name: String!
  subscribers: [Subscriber] @hasMany
  livreurID: ID!
  inscriptions: [Inscription] @hasMany
  startName: String
  startLongitude: Float!
  startLatitude: Float!
  daysOfWeek: [Boolean!]
  generateDayBefore: Boolean
  startTime: Float
  startTimeZone: String
  tournee: [Tournee] @hasMany
}

type Inscription @model
  @auth(rules: [
    { allow: groups, groups: ["wabap"] },
    { allow: owner, identityClaim: "custom:clientName" },
    { allow: owner, identityClaim: "sub", ownerField: "livreurID" }
  ])
{
  id: ID!
  owner: String @default(value: "France-Antilles")
  mission: Mission @belongsTo
  livreurID: ID!
}

type Tournee @model
  @auth(rules: [
    { allow: groups, groups: ["wabap"] }
    { allow: owner, identityClaim: "custom:clientName" },
    { allow: owner, identityClaim: "sub", ownerField: "livreurID", operations: [read, update] }
  ])
{
  id: ID!
  owner: String! @default(value: "France-Antilles")
  name: String!
  status: Status!
  colis: [Colis!]! @hasMany
  startName: String
  startLongitude: Float!
  startLatitude: Float!
  livreurID: ID! @index(name: "byLivreurOrderDate", queryField: "byLivreurOrderDate", sortKeyFields: ["createdAt"])
  missionTourneeId: ID! @index(name: "byMissionOrderDate", queryField: "byMissionOrderDate", sortKeyFields: ["createdAt"])
  mission: Mission!  @belongsTo(fields: ["missionTourneeId"])
  createdAt: AWSDateTime!
  distance: Int
  duree: Int
  nbColis: Int
}

type Colis @model
  @auth(rules: [
    { allow: groups, groups: ["wabap"] },
    { allow: owner, identityClaim: "custom:clientName" }
  ])
{
  id: ID!
  owner: String @default(value: "France-Antilles")
  tournee: Tournee! @belongsTo(fields: ["tourneeColisId"])
  tourneeColisId: ID! @index(name: "byTourneeOrderPosition", queryField: "byTourneeOrderPosition", sortKeyFields: ["position"])
  subscriber: Subscriber @belongsTo(fields: ["subscriberColisId"])
  subscriberColisId: ID @index(name: "bySubscriberOrderDate", queryField: "bySubscriberOrderDate", sortKeyFields: ["createdAt"])
  createdAt: AWSDateTime!
  position: Int!
  polyline: String
  distance: Int
  duration: Int
  address: String!
  longitude: Float!
  latitude: Float!
  subscriberName: String!
  lastStatus: ColisStatus! @hasOne
  logs: [ColisStatus!]! @hasMany
}

type ColisStatus @model
  @auth(rules: [
    { allow: groups, groups: ["wabap"] },
    { allow: owner, identityClaim: "custom:clientName" }
  ])
{
  id: ID!
  owner: String @default(value: "France-Antilles")
  colis: Colis @belongsTo(fields: ["colisLogsId"])
  colisLogsId: ID! @index(name: "byColisOrderDate", queryField: "byColisOrderDate", sortKeyFields: ["createdAt"])
  status: Status!
  message: String
  createdAt: AWSDateTime!
  longitude: Float
  latitude: Float
}

enum Status {
  PENDING
  IN_PROGRESS
  ISSUE
  COMPLETED
}

type Location @model
  @auth(rules: [
    { allow: groups, groups: ["wabap"] },
    { allow: owner, identityClaim: "custom:clientName" }
  ])
{
  id: ID!
  owner: String @default(value: "France-Antilles")
  userId: ID!
  userName: String
  tourneeId: String!
  latitude: Float!
  longitude: Float!
  lastUpdate: AWSDateTime!
}


# =====================================================================
# Plateforme de livraison (spec fonctionnelle v0.1)
# Les modèles V1 ci-dessus sont inchangés.
# Rôles : wabap (super admin), admin, dispatch (dispatcher), finance (comptable), livreur, client.
# Les données d'exploitation ne s'écrivent que par la fonction deliveryApi (règles métier) ;
# la configuration (clients, profils, grilles…) est éditée directement par les équipes Wabap.
# =====================================================================

enum OrderSource { CLIENT_APP API IMPORT MANUAL }
enum OrderStatus { AWAITING_PAYMENT CREATED TO_FIX PLANNED IN_PROGRESS DONE PARTIALLY_FAILED CANCELLED }
enum ParcelStatus { AWAITING_PICKUP PICKED_UP IN_TRANSIT DELIVERED FAILED RETURNING RETURNED }
enum LabelStatus { ACTIVE RESERVED UNUSED }
enum ParcelEventType { CREATED LABEL_GENERATED LABEL_SENT ASSIGNED_TO_TOUR PICKED_UP DELIVERED FAILED INCIDENT RETURNING RETURNED CANCELLED }
enum TourStatus { DRAFT PLANNED ASSIGNED ACCEPTED IN_PROGRESS DONE VALIDATED }
enum TourSlot { DAY NIGHT }
enum StopType { PICKUP DELIVERY MIXED }
enum StopStatus { TODO DONE PARTIAL FAILED }
enum BillingMode { ACCOUNT PER_ORDER }
enum LabelMode { STRICT FLEXIBLE }
enum CommentKind { PICKUP DELIVERY FAILURE }
enum GridStatus { DRAFT PUBLISHED }
enum EarningStatus { TO_VALIDATE VALIDATED PAID }

type Address {
  formatted: String
  number: String
  street: String
  complement: String
  postalCode: String
  city: String
  country: String
  latitude: Float
  longitude: Float
  geocodeQuality: String
}
type Contact { name: String phone: String email: String }
type OrderPoint { address: Address contact: Contact instructions: String }
type Anomaly { code: String! field: String message: String! }
type ProofRequirements { scan: Boolean photo: Boolean signature: Boolean geoloc: Boolean otp: Boolean }
type LabelEmailOptions { enabled: Boolean emails: [String] leadHours: Int }
type TrackingOptions { route: String showEta: Boolean showStopsBefore: Boolean showLivePosition: Boolean }
type TourAlert { stopId: ID code: String! message: String! }
type TourNotice { at: AWSDateTime! message: String! }
type TourIncident { parcelId: ID! customerId: String! motive: String! status: String! }
type Adjustment { amount: Float! reason: String! by: String at: AWSDateTime }
type Refund { at: AWSDateTime! amount: Float! reason: String! }

# ---------- Configuration ----------

type CustomerType @model
  @auth(rules: [{ allow: groups, groups: ["wabap", "admin"] }, { allow: private, operations: [read] }])
{
  id: ID!
  name: String!
  proofProfileId: ID
  defaultDeadline: String
}

"Client donneur d'ordre. id = valeur de l'attribut Cognito custom:clientName de ses utilisateurs."
type Customer @model
  @auth(rules: [
    { allow: groups, groups: ["wabap", "admin"] },
    { allow: groups, groups: ["dispatch", "finance"], operations: [read] },
    { allow: owner, ownerField: "id", identityClaim: "custom:clientName", operations: [read] }
  ])
{
  id: ID!
  name: String!
  customerTypeId: ID
  billingMode: BillingMode!
  labelMode: LabelMode
  dedicated: Boolean
  proofProfileId: ID
  "Valeurs par défaut (AWSJSON) : parcelCount, size, pickupAddress, pickupName, pickupPhone, deadlineAt"
  defaults: AWSJSON
  labelEmail: LabelEmailOptions
  reportEmails: [String]
  tracking: TrackingOptions
  "Forfait B2B (suivi de rentabilité)"
  forfaitAmount: Float
  forfaitKmQuota: Float
}

type Connector @model @auth(rules: [{ allow: groups, groups: ["wabap", "admin"] }])
{
  id: ID!
  customerId: ID! @index(name: "byCustomer")
  name: String!
  kind: String!
  "Champ interne → colonne(s) de la source (AWSJSON)"
  mapping: AWSJSON
}

type ProofProfile @model
  @auth(rules: [{ allow: groups, groups: ["wabap", "admin"] }, { allow: private, operations: [read] }])
{
  id: ID!
  name: String!
  pickup: ProofRequirements
  delivery: ProofRequirements
}

type CommentPreset @model
  @auth(rules: [{ allow: groups, groups: ["wabap", "admin"] }, { allow: private, operations: [read] }])
{
