# ---------- Opérations (fonction deliveryApi) ----------

type CourierPositionResult @aws_cognito_user_pools {
  tourId: ID
  courierId: ID!
  latitude: Float!
  longitude: Float!
  at: AWSDateTime!
}

type Query {
  quoteCourse(input: AWSJSON!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools
  orderTracking(orderId: ID!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools
  parcelHistory(parcelId: ID!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch"])
  courierTourView(tourId: ID!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["livreur", "wabap", "admin", "dispatch"])
  clientTourView(tourId: ID!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools
  tourEarningEstimate(tourId: ID!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch", "finance", "livreur"])
  courierStatement(courierId: ID!, month: String!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools
  myEarnings(month: String!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["livreur"])
  exportStatementsCsv(month: String!, courierIds: [ID!]!): String @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "finance"])
  commentStats(from: AWSDate!, to: AWSDate!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch"])
}

type Mutation {
  ingestOrder(customerId: String, source: OrderSource!, connectorId: ID, record: AWSJSON!): Order @function(name: "deliveryApi-${env}") @aws_cognito_user_pools
  ingestOrders(customerId: String, source: OrderSource, connectorId: ID, records: AWSJSON!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools
  fixOrder(orderId: ID!, patch: AWSJSON!): Order @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch"])
  createCourse(input: AWSJSON!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools
  confirmCoursePayment(orderId: ID!): Order @function(name: "deliveryApi-${env}") @aws_cognito_user_pools
  cancelOrder(orderId: ID!, reason: String): Order @function(name: "deliveryApi-${env}") @aws_cognito_user_pools
  commercialGesture(orderId: ID!, amount: Float!, reason: String!): Order @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch"])
  createTour(input: AWSJSON!): Tour @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch"])
  addOrdersToTour(tourId: ID!, orderIds: [ID!]!): Tour @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch"])
  removeOrderFromTour(tourId: ID!, orderId: ID!, reason: String): Tour @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch"])
  lockStop(stopId: ID!, locked: Boolean!): Stop @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch"])
  optimizeTour(tourId: ID!): Tour @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch"])
  assignTour(tourId: ID!, courierId: ID!): Tour @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "dispatch"])
  acceptTour(tourId: ID!): Tour @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["livreur"])
  startTour(tourId: ID!): Tour @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["livreur"])
  closeTour(tourId: ID!, reason: String): Tour @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["livreur", "wabap", "admin", "dispatch"])
  scanParcel(tourId: ID!, stopId: ID!, code: String!): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["livreur"])
  submitStop(input: AWSJSON!): Stop @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["livreur"])
  failStop(input: AWSJSON!): Stop @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["livreur"])
  updateCourierPosition(latitude: Float!, longitude: Float!): CourierPositionResult @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["livreur"])
  generateLabels(tourId: ID, orderId: ID, customerId: String, extraCount: Int): AWSJSON @function(name: "deliveryApi-${env}") @aws_cognito_user_pools
  adjustEarning(tourId: ID!, amount: Float!, reason: String!): TourEarning @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "finance"])
  validateEarning(tourId: ID!): TourEarning @function(name: "deliveryApi-${env}") @aws_cognito_user_pools(cognito_groups: ["wabap", "admin", "finance"])
